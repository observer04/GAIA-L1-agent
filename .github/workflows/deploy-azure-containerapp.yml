name: Deploy Azure Container App

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.AZURE_CREDENTIALS != '' && secrets.AZURE_CONTAINER_REGISTRY != '' && secrets.AZURE_RESOURCE_GROUP != '' && secrets.AZURE_CONTAINER_APP != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_NAME: gaia-agent
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ secrets.AZURE_CONTAINER_APP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        run: az acr login --name "$REGISTRY_NAME"

      - name: Build and push image
        run: |
          IMAGE_URI="$REGISTRY_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          docker build --build-arg VITE_BASE_PATH=/gaia_agent/ -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Update Azure Container App
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE_URI" \
              --set-env-vars \
                WEB_BASE_PATH=/gaia_agent \
                WEB_STATIC_DIR=/app/frontend/dist \
                WEB_PUBLIC_MODE=true \
                AGENT_ALLOW_UNSAFE_TOOLS=false
