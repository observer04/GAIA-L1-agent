name: Deploy Cloudflare Worker Route

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Root domain / zone name (e.g. ommprakash.cloud)
        required: false
        default: "ommprakash.cloud"
      pathPrefix:
        description: Strict path prefix (e.g. /gaia_agent)
        required: false
        default: "/gaia_agent"
      workerName:
        description: Worker name
        required: false
        default: "gaia-agent-path-router"
      azureOrigin:
        description: Azure origin hostname (without https://)
        required: false
        default: ""

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INPUT_DOMAIN: ${{ github.event.inputs.domain }}
      INPUT_PATH_PREFIX: ${{ github.event.inputs.pathPrefix }}
      INPUT_WORKER_NAME: ${{ github.event.inputs.workerName }}
      INPUT_AZURE_ORIGIN: ${{ github.event.inputs.azureOrigin }}
      SECRET_AZURE_ORIGIN: ${{ secrets.AZURE_ORIGIN_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install --global wrangler@3

      - name: Build wrangler config
        run: |
          set -euo pipefail

          DOMAIN="${INPUT_DOMAIN:-ommprakash.cloud}"
          PATH_PREFIX="${INPUT_PATH_PREFIX:-/gaia_agent}"
          WORKER_NAME="${INPUT_WORKER_NAME:-gaia-agent-path-router}"
          AZURE_ORIGIN="${INPUT_AZURE_ORIGIN:-}"
          if [ -z "$AZURE_ORIGIN" ]; then
            AZURE_ORIGIN="${SECRET_AZURE_ORIGIN:-}"
          fi

          if [ -z "$AZURE_ORIGIN" ]; then
            echo "Missing Azure origin host. Provide workflow input azureOrigin or secret AZURE_ORIGIN_HOST."
            exit 1
          fi

          if [[ "$PATH_PREFIX" != /* ]]; then
            PATH_PREFIX="/$PATH_PREFIX"
          fi

          cat > /tmp/wrangler.toml <<EOF
          name = "$WORKER_NAME"
          main = "deploy/cloudflare/worker.js"
          compatibility_date = "2026-03-31"

          [vars]
          AZURE_ORIGIN = "$AZURE_ORIGIN"

          routes = [
            { pattern = "$DOMAIN$PATH_PREFIX*", zone_name = "$DOMAIN" }
          ]
          EOF

      - name: Deploy worker route
        run: wrangler deploy --config /tmp/wrangler.toml
