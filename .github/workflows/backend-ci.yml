name: Backend CI

on:
  pull_request:
    paths:
      - "agent/**"
      - "backend/**"
      - "test_*.py"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "agent/**"
      - "backend/**"
      - "test_*.py"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q
